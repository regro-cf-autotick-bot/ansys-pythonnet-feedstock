{% set name = "ansys-pythonnet" %}
{% set version = "3.1.0rc8" %}
{% set python_min = python_min | default("3.10") %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://pypi.org/packages/source/{{ name[0] }}/{{ name }}/ansys_pythonnet-{{ version }}.tar.gz
  sha256: cc0b73bcbbca77527ae7712e97dc17f442313a57c2e2e3f654111d31e99d5f98

build:
  script: {{ PYTHON }} -m pip install . -vv
  number: 1
  noarch: python

requirements:
  build:
    - dotnet-sdk 10.0.*
    - openssl
  host:
    - python {{ python_min }}
    - setuptools >=80
    - wheel
    - pip
    - packaging >=24
    - pyproject-parser >=0.14
  run:
    - clr_loader >=0.3.1,<0.4.0
    - python >={{ python_min }},<3.15
  run_constrained:
    - dotnet-runtime >=3.1
    - mono >=6.12  # [not win]

test:
  imports:
    - pythonnet
  commands:
    - pip check
  requires:
    - pip
    - python {{ python_min }}

about:
  summary: .NET and Mono integration for Python (Ansys, Inc. fork)
  license: MIT
  license_file: LICENSE
  home: https://pypi.org/project/ansys-pythonnet/
  dev_url: https://github.com/ansys/ansys-pythonnet

extra:
  recipe-maintainers:
    - koubaa
    - SMoraisAnsys
